function chartSvg(tf){
 const configs={
  "1H":{count:28,base:82,vol:42,step:2.7},
  "4H":{count:32,base:76,vol:48,step:2.2},
  "1D":{count:36,base:70,vol:55,step:1.9}
 };
 const c=configs[tf]||configs["1D"], W=900,H=320, left=14,right=74,top=12,bottom=58, chartH=225, volTop=252, volH=48;
 let price=c.base, candles=[], vols=[];
 for(let i=0;i<c.count;i++){
   const wave=Math.sin(i*0.72)*5 + Math.sin(i*0.19)*4 + i*c.step;
   const open=price;
   const close=c.base+wave+(i%5===0?4:0);
   const high=Math.max(open,close)+4+(i%4);
   const low=Math.min(open,close)-3-(i%3);
   price=close; candles.push({open,close,high,low}); vols.push(16+(i*13)%35);
 }
 const min=Math.min(...candles.map(x=>x.low))-4,max=Math.max(...candles.map(x=>x.high))+4;
 const py=v=>top+(max-v)/(max-min)*chartH;
 const x=i=>left+i*((W-left-right)/(c.count-1));
 const candleW=Math.max(6,((W-left-right)/c.count)*0.62);
 let grid='';
 for(let g=0;g<=5;g++){const y=top+g*chartH/5;const val=max-(max-min)*g/5;grid+=`<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#252936" stroke-width="1"/><text x="${W-right+8}" y="${y+4}" fill="#70798b" font-size="11">${val.toFixed(2)}</text>`;}
 for(let g=0;g<6;g++){const xx=left+g*(W-left-right)/5;grid+=`<line x1="${xx}" y1="${top}" x2="${xx}" y2="${volTop+volH}" stroke="#1e222d" stroke-width="1"/>`; }
 let body='',volume='';
 candles.forEach((d,i)=>{const xx=x(i), up=d.close>=d.open, cls=up?'#00e6a0':'#ff5b72'; const yO=py(d.open),yC=py(d.close),yH=py(d.high),yL=py(d.low); body+=`<line x1="${xx}" y1="${yH}" x2="${xx}" y2="${yL}" stroke="${cls}" stroke-width="2"/><rect x="${xx-candleW/2}" y="${Math.min(yO,yC)}" width="${candleW}" height="${Math.max(2,Math.abs(yC-yO))}" fill="${cls}" rx="1"/>`; const vh=vols[i]; volume+=`<rect x="${xx-candleW/2}" y="${volTop+volH-vh}" width="${candleW}" height="${vh}" fill="${cls}" opacity=".38"/>`;});
 const last=candles[candles.length-1].close,lastY=py(last);
 return `<div class="tv-wrap"><svg class="tv-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="TradingView style candlestick chart">${grid}<line x1="${left}" y1="${volTop-6}" x2="${W-right}" y2="${volTop-6}" stroke="#252936"/><text x="${left}" y="${volTop+42}" fill="#596274" font-size="10">VOL</text>${volume}${body}<line x1="${left}" y1="${lastY}" x2="${W-right}" y2="${lastY}" stroke="#00e6a0" stroke-dasharray="5 5" opacity=".75"/><rect x="${W-right+3}" y="${lastY-10}" width="65" height="20" rx="4" fill="#00e6a0"/><text x="${W-right+35}" y="${lastY+4}" text-anchor="middle" fill="#06110e" font-size="11" font-weight="700">${last.toFixed(2)}</text></svg><div class="tv-footer"><span>${tf} • Candles</span><span>Volume</span><span>Demo market data</span></div></div>`;
}

 return `<h1 class="page-title">Perpetual Futures</h1><div class="subtitle">Search a pair, choose Long or Short, select leverage, then open a simulated position.</div><div class="banner">⚠️ <strong>High risk</strong> — leverage amplifies gains and losses. PULSE V5 is a prototype; orders are not real.</div><div class="perps-layout"><div><div class="card form" style="padding:14px"><div class="side-label">Search perpetuals</div><div class="searchbox"><span>⌕</span><input class="input" style="margin:0" placeholder="BTC, ETH, SOL..." value="${perpState.search}" oninput="setPerpSearch(this.value)"></div><div class="side-label">Markets</div><div class="perps-list">${filtered.map(x=>`<div class="pair-item ${x.sym===p.sym?'selected':''}" data-search="${(x.sym+' '+x.name+' '+x.base).toLowerCase()}" onclick="setPerpPair('${x.sym}')"><div class="row"><div><b>${x.name}</b><small>${x.base} perpetual</small></div><div class="pair-price"><b>${x.price}</b><div class="${x.change.startsWith('-')?'down':'up'}">${x.change}</div></div></div></div>`).join('')||'<div class="positions-empty">No pairs found.</div>'}</div><button class="secondary" onclick="openPerpPositions()">Positions (${positions.length})</button></div></div><div><div class="card form" style="padding:14px"><div class="row"><div><b>${p.name}</b><div class="demo">24h volume $${p.volume}</div></div><div style="text-align:right"><b>${p.price}</b><div class="${p.change.startsWith('-')?'down':'up'}">${p.change}</div></div></div><div id="tvReal" class="tv-real" style="margin-top:14px"><div class="positions-empty">Loading live TradingView chart…</div></div><div class="tv-note">Real-time market chart powered by TradingView for ${p.tv}. Use the chart's zoom, pan, candles, indicators and drawing tools.</div></div><div class="card form" style="margin-top:12px"><div class="side-label">Direction</div><div class="select-grid"><button class="choice long ${perpState.side==='LONG'?'active':''}" onclick="setPerpSide('LONG')">LONG</button><button class="choice short ${perpState.side==='SHORT'?'active':''}" onclick="setPerpSide('SHORT')">SHORT</button></div><div class="side-label">Leverage</div><div class="leverage-grid">${[1,2,5,10,20,25,50,100].map(n=>`<button class="choice ${perpState.leverage===n?'active':''}" onclick="setLeverage(${n})">${n}×</button>`).join('')}</div><div class="side-label">Margin (USDT)</div><input class="input" id="perpMargin" type="number" min="1" value="${perpState.margin}" oninput="perpState.margin=this.value;document.getElementById('perpSize').textContent='$'+((Number(this.value)||0)*perpState.leverage).toFixed(2)"><div class="order-preview"><div class="order-stat"><small>Margin</small><b>$${Number(perpState.margin).toFixed(2)}</b></div><div class="order-stat"><small>Leverage</small><b>${perpState.leverage}×</b></div><div class="order-stat"><small>Position size</small><b id="perpSize">$${size.toFixed(2)}</b></div></div><button class="primary" onclick="openPosition()">OPEN ${perpState.side}</button></div></div></div>`;

function openCommentsForPost(identifier){const clean=String(identifier).replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,'&');const p=allPosts().find(x=>String(x.id||'')===clean)||findPost(clean)||allPosts().find(x=>x.title===clean);if(!p){toast('Comments unavailable for this post');return;}state.commentsPost=p;const modal=document.getElementById('commentsModal');if(!modal)return;document.getElementById('commentsTitle').textContent='Comments · '+(p.comments||0);document.getElementById('commentsList').innerHTML=[['Sarah Onchain','The wallet activity is interesting.'],['Lena Trades','I would watch liquidity here.'],['CryptoMax','Good breakdown. What about funding?']].map(x=>`<div class="comment"><div class="user"><div class="avatar">${x[0].slice(0,2)}</div><div><b>${x[0]}</b><span>@${x[0].replace(/ /g,'')}</span></div></div><p style="margin:8px 0">${x[1]}</p><div class="comment-actions"><button>♡ Like</button><button onclick="replyToComment('${x[0]}')">↩ Reply</button><button>↗ Share</button></div><small>just now</small></div>`).join('');modal.style.display='flex'}
function openComments(idx){const p=demoPosts[idx]||state.posts[idx];if(p)openCommentsForPost(p.title)}
function closeComments(){const m=document.getElementById('commentsModal');if(m)m.style.display='none'}
function addComment(){const input=document.getElementById('commentInput');if(!input||!input.value.trim())return;const safe=input.value.replace(/[<>]/g,'');document.getElementById('commentsList').insertAdjacentHTML('afterbegin',`<div class="comment"><div class="user"><div class="avatar">AL</div><div><b>Alex Crypto</b><span>@AlexCrypto</span></div></div><p style="margin:8px 0">${safe}</p><div class="comment-actions"><button>♡ Like</button><button>↩ Reply</button><button>↗ Share</button></div><small>just now</small></div>`);if(state.commentsPost)state.commentsPost.comments=(state.commentsPost.comments||0)+1;input.value='';toast('Comment added')}
function replyToComment(name){const input=document.getElementById('commentInput');if(input){input.value='@'+String(name).replace(/\s+/g,'')+' ';input.focus();toast('Replying to '+name)}}
function repost(identifier){
 const raw=String(identifier).replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,'&');
 const original=allPosts().find(x=>x.id===raw || x.title===raw);
 if(!original){toast('Post not found');return}
 if(state.reposted.has(original.id||original.title)){state.reposted.delete(original.id||original.title);state.posts=state.posts.filter(p=>p.repostOfId!==(original.id||original.title));toast('Repost removed');render();return}
 state.repostTarget=original;
 const m=document.getElementById('repostModal');
 if(m){document.getElementById('repostUser').textContent=original.user;document.getElementById('repostHandle').textContent=original.handle;document.getElementById('repostTitle').textContent=original.title;document.getElementById('repostText').textContent=original.text;document.getElementById('repostNote').value='';m.style.display='flex';}
}
function closeRepost(){const m=document.getElementById('repostModal');if(m)m.style.display='none';state.repostTarget=null}
function confirmRepost(){
 const original=state.repostTarget;if(!original){closeRepost();return}
 const note=document.getElementById('repostNote').value.trim();
 const originalId=original.id||original.title;
 const copy={...original,id:'repost-'+Date.now(),title:original.title,text:original.text,user:'Alex Crypto',handle:'@AlexCrypto',avatar:'AL',repostOf:original.title,repostOfId:originalId,repostNote:note,likes:0,comments:0};
 state.reposted.add(originalId);state.posts.unshift(copy);closeRepost();toast('Reposted this post');render()
}
function savePost(title){const clean=String(title).replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,'&');state.saved.has(clean)?state.saved.delete(clean):state.saved.add(clean);toast(state.saved.has(clean)?'Saved':'Removed from Saved');render()}
function toggleVideoSound(key){const v=document.getElementById('vid-'+key);if(!v)return;v.muted=!v.muted;if(!v.muted)v.volume=1;v.play().catch(()=>{});toast(v.muted?'Sound off':'Sound on')}
function tip(name){state.tipTarget=name;const m=document.getElementById('tipModal');if(m){document.getElementById('tipTarget').textContent='Tip '+name;document.getElementById('tipAmount').value='';m.style.display='flex'}}
function sendTip(){const n=Number(document.getElementById('tipAmount').value||0);if(n<=0){toast('Enter a tip amount');return}state.rewards+=Math.min(n,100);document.getElementById('tipModal').style.display='none';toast('Tip of $'+n.toFixed(2)+' sent to '+state.tipTarget);render()}
function sharePost(encodedIdentifier){
 const identifier=decodeURIComponent(String(encodedIdentifier||''));
 const p=allPosts().find(x=>String(x.id||'')===identifier)||findPost(identifier)||allPosts().find(x=>x.title===identifier);
 const title=p?.title||identifier;
 const text='Check this out on PULSE: '+title;
 const modal=document.getElementById('shareModal');
 if(!modal)return;
 document.getElementById('shareText').textContent=text;
 const url=encodeURIComponent(location.href);
 document.getElementById('shareX').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+url;
 document.getElementById('shareTelegram').href='https://t.me/share/url?url='+url+'&text='+encodeURIComponent(text);
 document.getElementById('shareWhatsApp').href='https://wa.me/?text='+encodeURIComponent(text+' '+location.href);
 modal.style.display='flex';
}
function closeShare(){const m=document.getElementById('shareModal');if(m)m.style.display='none'}
function likePost(title,btn){const clean=String(title).replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,'&');if(state.likedPosts.has(clean))state.likedPosts.delete(clean);else state.likedPosts.add(clean);render()}
function like(btn){likePost('');}
function openMediaEditor(tab){if(!state.photo&&!state.video){toast('Add media first');return}state.editorTab=tab||'text';const m=document.getElementById('editorModal');if(!m)return;syncEditorPreview();m.style.display='flex';renderEditorTools()}
function closeMediaEditor(){const m=document.getElementById('editorModal');if(m)m.style.display='none'}
function syncEditorPreview(){const img=document.getElementById('editorImg'),vid=document.getElementById('editorVideo');if(img){img.style.display=state.photo?'block':'none';if(state.photo)img.src=state.photo;img.style.filter=state.photoFilter||'none'}if(vid){vid.style.display=state.video?'block':'none';if(state.video)vid.src=state.video}const tx=document.getElementById('editorText');const em=document.getElementById('editorEmoji');if(tx){tx.textContent=state.mediaText||'';tx.style.display=state.mediaText?'block':'none';tx.style.left=(state.dragPositions.text?.x||50)+'%';tx.style.top=(state.dragPositions.text?.y||42)+'%'}if(em){em.textContent=state.mediaEmoji||'';em.style.display=state.mediaEmoji?'block':'none';em.style.left=(state.dragPositions.emoji?.x||50)+'%';em.style.top=(state.dragPositions.emoji?.y||58)+'%'}setTimeout(enableEditorDragging,0)}
function renderEditorTools(){const box=document.getElementById('editorTools');if(!box)return;box.innerHTML=state.editorTab==='text'?`<div class="side-label">Add text</div><input id="editorTextInput" class="input" value="${esc(state.mediaText)}" placeholder="Write something…"><button class="primary" onclick="saveEditorText()">Add text</button>`:`<div class="side-label">Choose emoji</div><div class="emoji-grid">${['🔥','🚀','💎','❤️','😂','😎','📈','💰','👀','⚡','🧠','🎯'].map(e=>`<button class="choice" onclick="saveEditorEmoji('${e}')">${e}</button>`).join('')}</div><div class="side-label" style="margin-top:12px">Current emoji</div><input id="editorEmojiInput" class="input" value="${esc(state.mediaEmoji)}" placeholder="Or type an emoji…"><button class="primary" onclick="saveEditorEmoji(document.getElementById('editorEmojiInput').value)">Add emoji</button>`}
function enableEditorDragging(){
 ['editorText','editorEmoji'].forEach((id)=>{const el=document.getElementById(id);if(!el||el.dataset.dragReady)return;el.dataset.dragReady='1';let dragging=false;el.addEventListener('pointerdown',e=>{dragging=true;el.setPointerCapture(e.pointerId);e.preventDefault()});el.addEventListener('pointermove',e=>{if(!dragging)return;const stage=document.querySelector('.editor-stage');if(!stage)return;const r=stage.getBoundingClientRect();let x=((e.clientX-r.left)/r.width)*100;let y=((e.clientY-r.top)/r.height)*100;x=Math.max(8,Math.min(92,x));y=Math.max(8,Math.min(92,y));el.style.left=x+'%';el.style.top=y+'%';el.style.transform='translate(-50%,-50%)';state.dragPositions[id==='editorText'?'text':'emoji']={x,y}});el.addEventListener('pointerup',()=>dragging=false);el.addEventListener('pointercancel',()=>dragging=false)})
}
function saveEditorText(){state.mediaText=(document.getElementById('editorTextInput')?.value||'').trim();syncEditorPreview();toast(state.mediaText?'Text added':'Text removed')}
function saveEditorEmoji(e){state.mediaEmoji=String(e||'').trim();syncEditorPreview();toast(state.mediaEmoji?'Emoji added':'Emoji removed')}
function addMediaText(){openMediaEditor('text')}
function addMediaEmoji(){openMediaEditor('emoji')}
function rewards(){return `<div class="back-row"><button class="secondary" style="width:auto;margin:0;padding:8px 12px" onclick="back()">← Back</button></div><h1 class="page-title">Creator Rewards</h1><div class="subtitle">Track tips and creator activity rewards.</div><div class="card reward-card"><div class="row"><div><b>🏆 Reward points</b><div class="money-value">${state.rewards.toLocaleString()}</div></div><span class="verified-token">Creator</span></div><div class="reward-bar"><span></span></div><div class="demo">1,250 points earned in this prototype</div></div><div class="grid" style="margin-top:12px"><div class="card metric"><b>💰 Tips</b><div class="demo">Tips from live streams and posts can contribute to creator rewards.</div></div><div class="card metric"><b>🎥 Live</b><div class="demo">Engagement from live sessions contributes to your creator activity.</div></div><div class="card metric"><b>❤️ Engagement</b><div class="demo">Likes, comments, saves and reposts are tracked.</div></div></div>`}
async function startLiveCamera(){
 if(!navigator.mediaDevices?.getUserMedia){toast('Camera access is not supported in this browser');return}
 try{const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});state.liveStream=stream;state.live=true;render();setTimeout(()=>{const v=document.getElementById('livePreview');if(v){v.srcObject=stream;v.muted=true;v.play().catch(()=>{})}},50);toast('Camera and microphone connected')}catch(e){toast('Camera/microphone permission was denied')}
}
function stopLiveCamera(){if(state.liveStream){state.liveStream.getTracks().forEach(t=>t.stop());state.liveStream=null}state.live=false;render();toast('Live ended')}
function livePage(){return `<div class="back-row"><button class="secondary" style="width:auto;margin:0;padding:8px 12px" onclick="back()">← Back</button></div><h1 class="page-title">Go Live</h1><div class="subtitle">Start a live market discussion and let viewers tip you.</div><div class="card live-card"><div class="banner">🔴 Camera preview uses your real camera and microphone. Public broadcasting to other users requires a live-stream backend.</div><div style="position:relative;margin:12px 0"><video id="livePreview" class="live-video" autoplay playsinline muted></video>${state.live?'':'<div id="livePlaceholder" style="display:grid;place-items:center;min-height:300px;background:#08090d;border-radius:14px;border:1px solid var(--border)"><div style="text-align:center"><div style="font-size:48px">📹</div><b>Camera ready</b><div class="demo">Tap Start Live to request camera and microphone access.</div></div></div>'}</div><div class="row"><button class="primary" style="width:auto" onclick="${state.live?'stopLiveCamera()':'startLiveCamera()'}">${state.live?'End Live':'🔴 Start Live'}</button><button class="secondary" style="width:auto;margin:0" onclick="tip('Live viewers')">💰 Custom Tip</button><button class="secondary" style="width:auto;margin:0" onclick="go('rewards')">🏆 Rewards</button></div></div><div class="card metric" style="margin-top:12px"><b>Live tips</b><div class="demo">Viewers can choose preset or custom tip amounts.</div></div>`}
function render(){
 renderNav();
 const a=document.getElementById("app");
 if(state.page==="home")a.innerHTML=home();
 else if(state.page==="discover")a.innerHTML=discover();
 else if(state.page==="markets")a.innerHTML=markets();
 else if(state.page==="wallet")a.innerHTML=wallet();
 else if(state.page==="friends")a.innerHTML=friends();
 else if(state.page==="launchpad")a.innerHTML=launchpad();
 else if(state.page==="user-followers")a.innerHTML=socialList("followers");
 else if(state.page==="user-following")a.innerHTML=socialList("following");
 else if(state.page==="create")a.innerHTML=create();
 else if(state.page==="activity")a.innerHTML=activity();
 else if(state.page==="rewards")a.innerHTML=rewards();
 else if(state.page==="live")a.innerHTML=livePage();
 else if(state.page==="profile")a.innerHTML=profile();
 else if(state.page==="futures"){a.innerHTML=futures(); if(!perpState.showPositions) renderTV(selectedPerp().tv);}
 else if(state.page==="messages")a.innerHTML=messages();
 else if(state.page.startsWith("user:"))a.innerHTML=userProfile();
 else if(state.page.startsWith("dm:"))a.innerHTML=dmPage();
 if(state.page!=="home" && !a.querySelector(".back-row") && !a.querySelector(".back-global")){a.insertAdjacentHTML("afterbegin",`<div class="back-row back-global"><button class="secondary" style="width:auto;margin:0 0 12px;padding:8px 12px" onclick="back()">← Back</button></div>`);}

 else if(state.page.startsWith("token:")){const k=state.page.split(":")[1];a.innerHTML=tokenPage(k);setTimeout(()=>renderTokenTV(tokens[k].tv),0);}
 else if(state.page.startsWith("buy:"))a.innerHTML=buyPage(state.page.split(":")[1]);
 else if(state.page.startsWith("success:"))a.innerHTML=successPage(state.page.split(":")[1]);
}
function like(btn){state.liked=!state.liked;btn.classList.toggle("liked",state.liked);btn.textContent=state.liked?"♥ 125":"♡ 124"}
render();
</script>

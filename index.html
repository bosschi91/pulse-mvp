<!DOCTYPE html>
<html lang="en">
<head>

<title>PULSE — Onchain markets. Socially.</title>
<style>
:root{
  --bg:#08090c; --panel:#101116; --panel2:#14151c; --border:#20232c;

  --red:#ff5b72; --blue:#2aa7ff; --purple:#9a75ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:225px;border-right:1px solid var(--border);padding:22px 18px;position:fixed;inset:0 auto 0 0;background:#0c0d11}
.brand{display:flex;align-items:center;gap:10px;margin:4px 4px 34px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--green);display:grid;place-items:center}
.logo:after{content:"";width:11px;height:11px;border-radius:50%;background:#091014}

.spark{height:54px;flex:1;max-width:260px}.spark svg{width:100%;height:100%}
.actions{display:flex;align-items:center;gap:18px;color:var(--muted);margin-top:14px}.actions button{border:0;background:transparent;color:inherit}.actions .liked{color:#ff5570}.buy{margin-left:auto;border:0;background:var(--green);color:#06110e;font-weight:800;padding:11px 17px;border-radius:12px}

.risk{border-left:3px solid #e4b84f;padding:13px 15px;background:#15140f;border-radius:10px;color:#bfc4ce;margin:12px 0}
.primary{width:100%;border:0;background:var(--green);color:#06110e;font-weight:850;padding:15px;border-radius:13px;font-size:16px}
.secondary{width:100%;border:1px solid var(--border);background:transparent;color:#fff;padding:14px;border-radius:13px;margin-top:10px}
.chart{padding:18px}.chart svg{width:100%;height:270px;display:block}.tv-wrap{margin-top:2px;background:#0c0e13;border:1px solid #1f2430;border-radius:10px;overflow:hidden}.tv-chart{height:330px!important;background:#0c0e13}.tv-footer{display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid #1f2430;color:#687285;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.timeframes{display:flex;gap:7px;margin:14px 0}.timeframes button{border:1px solid var(--border);background:#171821;color:#aeb6c4;border-radius:9px;padding:8px 13px;font-weight:700}.timeframes button.active{background:var(--green);color:#06110e;border-color:var(--green)}.watch-btn{border:1px solid var(--border);background:#171821;color:#fff;border-radius:11px;padding:10px 13px;font-weight:700}.watch-btn.watching{color:var(--green);border-color:var(--green)}.photo-preview{margin:10px 0;border-radius:13px;overflow:hidden;border:1px solid var(--border);display:none}.photo-preview{position:relative}.photo-preview img{width:100%;max-height:360px;object-fit:cover;display:block}.photo-remove{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.72);color:#fff;font-size:20px;line-height:32px;padding:0;cursor:pointer}.activity-item{padding:16px}.activity-icon{width:38px;height:38px;border-radius:11px;background:#171821;display:grid;place-items:center;font-size:18px}.demo{color:#697386;font-size:12px;margin-top:5px}
.form{padding:20px}.input,.textarea{width:100%;border:1px solid var(--border);background:#171821;color:#fff;border-radius:12px;padding:13px;margin:7px 0 14px;outline:none}.textarea{min-height:130px;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}.chip{border:1px solid var(--border);background:#171821;color:#c8ced9;border-radius:9px;padding:8px 11px}.chip.selected{border-color:var(--green);color:var(--green)}

.profile-head{display:flex;gap:16px;align-items:center}.profile-head .avatar{width:72px;height:72px;font-size:24px}.profile-name{font-size:22px;font-weight:800}.profile-handle,.profile-bio{color:var(--muted)}.stats{display:flex;gap:28px;margin-top:18px}.stats b{color:#fff}.stats span{color:var(--muted)}

.video-feed{max-width:620px;margin:0 auto}.video-card{position:relative;background:#050608;border:1px solid var(--border);border-radius:18px;overflow:hidden;min-height:640px;margin:0 auto 18px;display:flex;align-items:stretch}.video-card video{width:100%;height:640px;object-fit:cover;display:block;background:#08090c}.video-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;background:linear-gradient(transparent 42%,rgba(0,0,0,.82) 100%);pointer-events:none}.video-user{display:flex;align-items:center;gap:10px;margin-bottom:12px}.video-user b{font-size:15px}.video-user span{display:block;color:#c3c9d4;font-size:12px}.video-caption{font-size:15px;line-height:1.4;max-width:82%;margin-bottom:8px}.video-token{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);padding:7px 10px;border-radius:10px;font-size:12px;width:max-content}.video-actions{position:absolute;right:12px;bottom:84px;display:grid;gap:10px;z-index:2}.video-actions button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.55);color:#fff;font-size:18px}.video-actions small{display:block;text-align:center;color:#fff;font-size:10px;margin-top:-6px}.video-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.video-tabs{display:flex;gap:18px}.video-tabs button{border:0;background:none;color:var(--muted);font-weight:800}.video-tabs button.active{color:#fff}.video-upload-preview{margin:10px 0;border:1px solid var(--border);border-radius:13px;overflow:hidden;position:relative;display:none}.video-upload-preview video{width:100%;max-height:420px;object-fit:contain;background:#050608;display:block}.video-upload-remove{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.72);color:#fff;font-size:22px;line-height:34px;padding:0}.video-demo-note{color:#697386;font- .mobile-nav{display:none}
@media(max-width:760px){
 .sidebar{display:none}.main{margin-left:0;width:100%;padding:22px 15px 90px}.container{max-width:none}
 .mobile-nav{display:flex;position:fixed;z-index:9;left:10px;right:10px;bottom:10px;background:#111218;border:1px solid var(--border);border-radius:16px;padding:7px;justify-content:space-around}
 .mobile-nav button{border:0;background:none;color:var(--muted);font-size:11px;padding:7px}.mobile-nav button.active{color:var(--green)}
 .grid{grid-template-columns:1fr}.spark{display:none}.buy{padding:10px 12px}.page-title{font-size:25px}
}
.hidden{display:none!important}
.perps-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}.perps-list{max-height:520px;overflow:auto}.searchbox{position:relative}.searchbox input{padding-left:38px}.searchbox span{position:absolute;left:13px;top:15px;color:var(--muted)}.pair-item{padding:13px;border:1px solid transparent;border-radius:12px;cursor:pointer}.pair-item:hover,.pair-item.selected{background:#181a22;border-color:var(--border)}.pair-item b{display:block}.pair-item small{color:var(--muted)}.pair-price{text-align:right}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:15px 0 8px}.select-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--border);background:#171821;color:#c8ced9;border-radius:10px;padding:10px;font-weight:800}.choice.long.active{background:rgba(0,230,160,.12);border-color:var(--green);color:var(--green)}.choice.short.active{background:rgba(255,91,114,.12);border-color:var(--red);color:var(--red)}.leverage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.position{padding:15px}.position.long{border-left:3px solid var(--green)}.position.short{border-left:3px solid var(--red)}.tv-real{height:520px;background:#0c0e13;border:1px solid #1f2430;border-radius:10px;overflow:hidden}.tv-real .tradingview-widget-container,.tv-real .tradingview-widget-container__widget{height:100%;width:100%}.tv-note{color:#697386;font-size:11px;margin-top:7px}.order-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.order-stat{background:#171821;border:1px solid var(--border);border-radius:10px;padding:10px}.order-stat small{display:block;color:var(--muted);font-size:11px}.order-stat b{display:block;margin-top:4px}.positions-empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:900px){.perps-layout{grid-template-columns:1fr}.perps-list{max-height:none}.tv-real{height:430px}.order-preview{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">

</div>

<script>
const tokens={
 XYZ:{symbol:"$XYZ",name:"Xyz Protocol",price:"$0.0420",change:"+18.4%",coin:"XYZ",cls:"",why:"Volume and new-holder growth accelerating.",market:"$14.2M",liq:"$1.4M",vol:"$3.8M",holders:"18,421"},
 ABC:{symbol:"$ABC",name:"ABC Network",price:"$1.87",change:"+27.8%",coin:"ABC",cls:"blue",why:"Large-wallet accumulation detected.",market:"$42.8M",liq:"$4.8M",vol:"$8.2M",holders:"52,610"},
 DEF:{symbol:"$DEF",name:"DEF Finance",price:"$0.3100",change:"+19.4%",coin:"DEF",cls:"purple",why:"Product launch driving organic holder growth.",market:"$18.3M",liq:"$2.1M",vol:"$4.1M",holders:"29,402"},
 PEPE:{symbol:"$PEPE",name:"Pepe Onchain",price:"$8.40e-6",change:"+11.2%",coin:"PEP",cls:"",why:"Social activity accelerating.",market:"$7.9M",liq:"$920K",vol:"$2.7M",holders:"41,290"},
 FOMO:{symbol:"$FOMO",name:"Fomo Index",price:"$2.34",change:"-3.1%",coin:"FOM",cls:"red",why:"Social mentions cooling.",market:"$9.1M",liq:"$1.1M",vol:"$1.9M",holders:"8,120"}
};
let state={page:"home",liked:false,watch:new Set(),posts:[],photo:null,video:null,chartTf:"1D",videoTab:"For You"};
const demoPosts=[
 {user:"Alex Crypto",handle:"@AlexCrypto",avatar:"AL",title:"Why I'm watching $XYZ",text:"Interesting volume growth + increasing holders. The onchain data tells a different story than the charts.",token:"XYZ",likes:124,comments:31},
 {user:"Sarah Onchain",handle:"@SarahOnchain",avatar:"SA",avatarCls:"orange",title:"$ABC accumulation pattern",text:"Three smart wallets I track all added $ABC positions in the last 24h. Worth paying attention.",token:"ABC",likes:82,comments:18},
 {user:"Lena Trades",handle:"@LenaTrades",avatar:"LE",avatarCls:"pink",title:"Watching liquidity before entry",text:"I want to see whether liquidity keeps expanding before I make a decision.",token:"DEF",likes:57,comments:11},
 {user:"CryptoMax",handle:"@CryptoMax",avatar:"CM",avatarCls:"blue",title:"Why $XYZ is moving",text:"Quick onchain breakdown — watch the wallet flows before chasing the candle.",token:"XYZ",likes:231,comments:42,video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"},
 {user:"Sarah Onchain",handle:"@SarahOnchain",avatar:"SA",avatarCls:"orange",title:"3 things I check before a perp",text:"Funding, open interest and liquidation levels. Here is the quick breakdown.",token:"ABC",likes:184,comments:27,video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"}
];
function navItems(){
 const items=[["home","⌂","Home"],["discover","◉","Discover"],["futures","↕","Perps"],["create","+","Create"],["messages","✉","DMs"],["activity","〽","Activity"],["profile","♙","Profile"]];
 return items.map(([id,ic,label])=>`<button class="${state.page===id?"active":""}" onclick="go('${id}')">${ic}&nbsp;&nbsp;${label}</button>`).join("");
}
function renderNav(){
 document.getElementById("nav").innerHTML=navItems();
 document.getElementById("mobileNav").innerHTML=navItems().replace(/&nbsp;&nbsp;/g,"<br>");
}
function go(p){state.page=p;render();}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1600)}
function coin(t){return `<div class="coin ${t.cls}">${t.coin}</div>`}
function spark(up=true){
 return `<div class="spark"><svg viewBox="0 0 240 60" preserveAspectRatio="none"><polyline fill="none" stroke="${up?'#00e6a0':'#ff5b72'}" stroke-width="2.5" points="${up?'0,45 20,39 42,42 64,33 84,37 108,26 130,31 151,22 174,28 194,17 214,20 240,10':'0,18 25,12 46,24 70,16 91,29 115,22 138,36 162,30 188,41 210,35 240,49'}"/></svg></div>`;
}
function tokenCard(k,withBuy=true){
 const t=tokens[k]; return `<div class="token-card" onclick="token('${k}')">${coin(t)}<div class="token-main"><b>${t.symbol}</b><small>${t.name}</small></div>${spark(!t.change.startsWith("-"))}<div class="price">${t.price}<div class="${t.change.startsWith("-")?'down':'up'}">${t.change}</div></div>${withBuy?`<button class="buy" onclick="event.stopPropagation();buy('${k}')">BUY ${t.symbol} ↗</button>`:""}</div>`;
}
function postCard(p){
 const t=tokens[p.token]; if(p.video) return videoCard(p); return `<article class="card post">
 <div class="user" onclick="event.stopPropagation();openProfile('${p.handle}','${p.user}')" style="cursor:pointer"><div class="avatar ${p.avatarCls||""}">${p.avatar}</div><div><b>${p.user}</b><span>${p.handle} · 2h</span></div></div>
 <h3>${p.title}</h3><p>${p.text}</p>${p.photo?`<img src="${p.photo}" style="width:100%;max-height:360px;object-fit:cover;border-radius:12px;margin-bottom:12px">`:''}${tokenCard(p.token,false)}
 <div class="actions"><button onclick="like(this)">♡ ${p.likes+(state.liked&&p===demoPosts[0]?1:0)}</button><button>◯ ${p.comments}</button><button onclick="toast('Link copied')">⌯</button><button class="buy" onclick="buy('${p.token}')">BUY ${t.symbol} ↗</button></div>
 </article>`;
}
function videoCard(p){
 const t=tokens[p.token]; return `<article class="video-card"><video src="${p.video}" autoplay muted loop playsinline controls></video><div class="video-overlay"><div class="video-user" onclick="openProfile('${p.handle}','${p.user}')" style="cursor:pointer;pointer-events:auto"><div class="avatar ${p.avatarCls||''}">${p.avatar}</div><div><b>${p.user}</b><span>${p.handle}</span></div></div><div class="video-caption"><b>${p.title}</b><br>${p.text}</div><div class="video-token" onclick="token('${p.token}')" style="cursor:pointer;pointer-events:auto">${t.symbol} · ${t.change}</div></div><div class="video-actions"><div><button onclick="like(this)">♡</button><small>${p.likes}</small></div><div><button onclick="toast('${p.comments} comments')">💬</button><small>${p.comments}</small></div><div><button onclick="toast('Link copied')">↗</button><small>Share</small></div><div><button onclick="buy('${p.token}')">↗</button><small>Trade</small></div></div></article>`;
}
function home(){
 const posts=[...state.posts,...demoPosts]; const videos=posts.filter(p=>p.video);
 return `<div class="video-topbar"><div><h1 class="page-title">PULSE</h1><div class="subtitle" style="margin-bottom:0">Onchain videos. Markets. People.</div></div><button class="watch-btn" onclick="go('create')">+ Post video</button></div><div class="video-tabs"><button class="${state.videoTab==='For You'?'active':''}" onclick="state.videoTab='For You';render()">For You</button><button class="${state.videoTab==='Following'?'active':''}" onclick="state.videoTab='Following';render()">Following</button><button onclick="go('discover')">Markets</button></div><div class="banner" style="margin-top:14px">🔥 <strong>Trending now</strong> — $XYZ +18.4% · $ABC +27.8% · $DEF +19.4%</div><div class="video-feed">${videos.map(videoCard).join('')}${!videos.length?'<div class="card metric">No videos yet. Create the first PULSE video.</div>':''}</div>`;
}
function discover(){
 return `<h1 class="page-title">Discover</h1><div class="subtitle">Evidence before hype</div>
 <h2 class="section-title">🔥 Trending</h2>
 ${["XYZ","ABC","DEF"].map((k,i)=>`<div class="list-card card" onclick="token('${k}')"><div style="display:flex;justify-content:space-between;color:#7e8799;font-size:12px;margin-bottom:7px"><span>#${i+1} Trending</span><span style="color:var(--green)">${tokens[k].change}</span></div>${tokenCard(k,false)}<div style="padding:8px 2px 2px;color:#7e8799;font-size:12px">Why trending</div><div style="padding:0 2px 4px">${tokens[k].why}</div></div>`).join("")}
 <h2 class="section-title">🐋 Smart Wallets</h2>
 ${[["0x72...A91","+142.5%","$XYZ  $ABC  $DEGEN"],["0x4F...C23","+89.3%","$XYZ  $PEPE  $DEF"],["0x9A...E07","+67.1%","$ABC  $DEF  $FOMO"],["0x1B...D54","+234.8%","$DEGEN  $XYZ  $PEPE"]].map(x=>`<div class="card list-card"><div class="row"><div><b>${x[0]}</b><div style="color:#7e8799;font-size:12px">Smart Wallet</div></div><b style="color:var(--green)">${x[1]}</b></div><div style="color:#8c95a6;font-size:13px;margin-top:9px">Bought: ${x[2]}</div></div>`).join("")}
 <h2 class="section-title">💬 Most Discussed</h2><div class="grid">${["XYZ","ABC","DEF","PEPE"].map((k,i)=>`<div class="card metric" onclick="token('${k}')"><small>#${i+1}</small><b>${tokens[k].symbol}</b><span style="color:#7e8799">${i*37+124} posts</span></div>`).join("")}</div>`;
}
function token(k){
 state.page="token:"+k; render();
}
function chartSvg(tf){
 const configs={
  "1H":{count:28,base:82,vol:42,step:2.7},
  "4H":{count:32,base:76,vol:48,step:2.2},
  "1D":{count:36,base:70,vol:55,step:1.9}
 };
 const c=configs[tf]||configs["1D"], W=900,H=320, left=14,right=74,top=12,bottom=58, chartH=225, volTop=252, volH=48;
 let price=c.base, candles=[], vols=[];
 for(let i=0;i<c.count;i++){
   const wave=Math.sin(i*0.72)*5 + Math.sin(i*0.19)*4 + i*c.step;
   const open=price;
   const close=c.base+wave+(i%5===0?4:0);
   const high=Math.max(open,close)+4+(i%4);
   const low=Math.min(open,close)-3-(i%3);
   price=close; candles.push({open,close,high,low}); vols.push(16+(i*13)%35);
 }
 const min=Math.min(...candles.map(x=>x.low))-4,max=Math.max(...candles.map(x=>x.high))+4;
 const py=v=>top+(max-v)/(max-min)*chartH;
 const x=i=>left+i*((W-left-right)/(c.count-1));
 const candleW=Math.max(6,((W-left-right)/c.count)*0.62);
 let grid='';
 for(let g=0;g<=5;g++){const y=top+g*chartH/5;const val=max-(max-min)*g/5;grid+=`<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#252936" stroke-width="1"/><text x="${W-right+8}" y="${y+4}" fill="#70798b" font-size="11">${val.toFixed(2)}</text>`;}
 for(let g=0;g<6;g++){const xx=left+g*(W-left-right)/5;grid+=`<line x1="${xx}" y1="${top}" x2="${xx}" y2="${volTop+volH}" stroke="#1e222d" stroke-width="1"/>`; }
 let body='',volume='';
 candles.forEach((d,i)=>{const xx=x(i), up=d.close>=d.open, cls=up?'#00e6a0':'#ff5b72'; const yO=py(d.open),yC=py(d.close),yH=py(d.high),yL=py(d.low); body+=`<line x1="${xx}" y1="${yH}" x2="${xx}" y2="${yL}" stroke="${cls}" stroke-width="2"/><rect x="${xx-candleW/2}" y="${Math.min(yO,yC)}" width="${candleW}" height="${Math.max(2,Math.abs(yC-yO))}" fill="${cls}" rx="1"/>`; const vh=vols[i]; volume+=`<rect x="${xx-candleW/2}" y="${volTop+volH-vh}" width="${candleW}" height="${vh}" fill="${cls}" opacity=".38"/>`;});
 const last=candles[candles.length-1].close,lastY=py(last);
 return `<div class="tv-wrap"><svg class="tv-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="TradingView style candlestick chart">${grid}<line x1="${left}" y1="${volTop-6}" x2="${W-right}" y2="${volTop-6}" stroke="#252936"/><text x="${left}" y="${volTop+42}" fill="#596274" font-size="10">VOL</text>${volume}${body}<line x1="${left}" y1="${lastY}" x2="${W-right}" y2="${lastY}" stroke="#00e6a0" stroke-dasharray="5 5" opacity=".75"/><rect x="${W-right+3}" y="${lastY-10}" width="65" height="20" rx="4" fill="#00e6a0"/><text x="${W-right+35}" y="${lastY+4}" text-anchor="middle" fill="#06110e" font-size="11" font-weight="700">${last.toFixed(2)}</text></svg><div class="tv-footer"><span>${tf} • Candles</span><span>Volume</span><span>Demo market data</span></div></div>`;
}

 const a=document.getElementById("app");
 if(state.page==="home")a.innerHTML=home();
 else if(state.page==="discover")a.innerHTML=discover();
 else if(state.page==="create")a.innerHTML=create();
 else if(state.page==="activity")a.innerHTML=activity();
 else if(state.page==="profile")a.innerHTML=profile();
 else if(state.page==="futures"){a.innerHTML=futures(); if(!perpState.showPositions) renderTV(selectedPerp().tv);}
 else if(state.page==="messages")a.innerHTML=messages();
 else if(state.page.startsWith("user:"))a.innerHTML=userProfile();
 else if(state.page.startsWith("dm:"))a.innerHTML=dmPage();
 else if(state.page.startsWith("token:"))a.innerHTML=tokenPage(state.page.split(":")[1]);
 else if(state.page.startsWith("buy:"))a.innerHTML=buyPage(state.page.split(":")[1]);
 else if(state.page.startsWith("success:"))a.innerHTML=successPage(state.page.split(":")[1]);
}
function like(btn){state.liked=!state.liked;btn.classList.toggle("liked",state.liked);btn.textContent=state.liked?"♥ 125":"♡ 124"}
render();
</script>
</body>
</html>

size:11px;margin-top:8px}.feed-mixed{max-width:760px;margin:16px auto}.media-overlay{position:absolute;left:18px;bottom:18px;color:#fff;font-size:28px;font-weight:900;text-shadow:0 2px 8px #000;z-index:3;pointer-events:none}.toast{position:fixed;right:25px;bottom:25px;background:#151820;border:1px solid var(--border);padding:12px 16px;border-radius:12px;display:none;z-index:10}
.comments-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:30;padding:18px}.comments-box{width:min(560px,100%);max-height:82vh;overflow:auto;background:#111218;border:1px solid var(--border);border-radius:18px;padding:18px}.comment{padding:12px 0;border-bottom:1px solid var(--border)}.twitter-comment{display:flex;gap:10px}.comment-actions{display:flex;gap:16px}.comment-actions button{border:0;background:none;color:var(--muted);padding:2px 0}.comment:last-child{border-bottom:0}.comment small{color:var(--muted)}.media-tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.media-tool{border:1px solid var(--border);background:#171821;color:#c8ced9;border-radius:9px;padding:8px 10px}.live-card{padding:18px}.live-video{width:100%;max-height:520px;background:#050608;border-radius:14px;object-fit:cover}.reward-card{padding:16px}.reward-bar{height:9px;background:#1a1d25;border-radius:99px;overflow:hidden;margin-top:9px}.reward-bar span{display:block;height:100%;background:var(--green);width:62%}.share-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.share-row button{border:1px solid var(--border);background:#171821;color:#fff;border-radius:9px;padding:8px 11px}.back-row{margin-bottom:14px}.post-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.post-tools button{border:0;background:transparent;color:var(--muted);padding:5px}.post-tools button.active{color:var(--green)}
.mobile-nav{display:none}
@media(max-width:760px){
 .sidebar{display:none}.main{margin-left:0;width:100%;padding:22px 15px 90px}.container{max-width:none}
 .mobile-nav{display:flex;position:fixed;z-index:9;left:10px;right:10px;bottom:10px;background:#111218;border:1px solid var(--border);border-radius:16px;padding:7px;justify-content:space-around}
 .mobile-nav button{border:0;background:none;color:var(--muted);font-size:11px;padding:7px}.mobile-nav button.active{color:var(--green)}
 .grid{grid-template-columns:1fr}.spark{display:none}.buy{padding:10px 12px}.page-title{font-size:25px}
}
.hidden{display:none!important}
.perps-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}.perps-list{max-height:520px;overflow:auto}.searchbox{position:relative}.searchbox input{padding-left:38px}.searchbox span{position:absolute;left:13px;top:15px;color:var(--muted)}.pair-item{padding:13px;border:1px solid transparent;border-radius:12px;cursor:pointer}.pair-item:hover,.pair-item.selected{background:#181a22;border-color:var(--border)}.pair-item b{display:block}.pair-item small{color:var(--muted)}.pair-price{text-align:right}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:15px 0 8px}.select-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--border);background:#171821;color:#c8ced9;border-radius:10px;padding:10px;font-weight:800}.choice.active{background:#fff;color:#08090c;border-color:#fff}.choice.long.active{background:rgba(0,230,160,.12);border-color:var(--green);color:var(--green)}.choice.short.active{background:rgba(255,91,114,.12);border-color:var(--red);color:var(--red)}.leverage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.position{padding:15px}.position.long{border-left:3px solid var(--green)}.position.short{border-left:3px solid var(--red)}.tv-real{height:520px;background:#0c0e13;border:1px solid #1f2430;border-radius:10px;overflow:hidden}.tv-real .tradingview-widget-container,.tv-real .tradingview-widget-container__widget{height:100%;width:100%}.tv-note{color:#697386;font-size:11px;margin-top:7px}.order-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.order-stat{background:#171821;border:1px solid var(--border);border-radius:10px;padding:10px}.order-stat small{display:block;color:var(--muted);font-size:11px}.order-stat b{display:block;margin-top:4px}.positions-empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:900px){.perps-layout{grid-template-columns:1fr}.perps-list{max-height:none}.tv-real{height:430px}.order-preview{grid-template-columns:1fr 1fr}}

.wallet-pill{display:flex;align-items:center;gap:8px;margin:10px 0}.verified{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#4da3ff;color:#fff;font-size:11px;font-weight:900;margin-left:5px}.money-card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.money-value{font-size:30px;font-weight:900}.filter-row,.token-filters{display:flex;gap:8px;flex-wrap:wrap}.filter-row button.active,.token-filters button.active{background:#fff;color:#08090c}.market-table{width:100%;border-collapse:collapse}.market-table th,.market-table td{padding:11px 8px;border-bottom:1px solid var(--border);text-align:right;font-size:13px}.market-table th:first-child,.market-table td:first-child{text-align:left}.market-table tr{cursor:pointer}.market-table tr:hover{background:#151720}.launch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.friend-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.friend-row:last-child{border-bottom:0}.social-stats{cursor:pointer}.verified-token{font-size:11px;color:#6fb5ff}.wallet-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:700px){.launch-grid{grid-template-columns:1fr}.wallet-actions{grid-template-columns:1fr}.market-table{font-size:12px}.market-table th:nth-child(4),.market-table td:nth-child(4){display:none}}
</style>

</div>

<script>
const tokens={

 ABC:{verified:true,symbol:"$ABC",name:"ABC Network",price:"$1.87",change:"+27.8%",coin:"ABC",cls:"blue",why:"Large-wallet accumulation detected.",market:"$42.8M",liq:"$4.8M",vol:"$8.2M",holders:"52,610",tv:"BINANCE:ETHUSDT"},
 DEF:{verified:false,symbol:"$DEF",name:"DEF Finance",price:"$0.3100",change:"+19.4%",coin:"DEF",cls:"purple",why:"Product launch driving organic holder growth.",market:"$18.3M",liq:"$2.1M",vol:"$4.1M",holders:"29,402",tv:"BINANCE:SOLUSDT"},
 PEPE:{verified:false,symbol:"$PEPE",name:"Pepe Onchain",price:"$8.40e-6",change:"+11.2%",coin:"PEP",cls:"",why:"Social activity accelerating.",market:"$7.9M",liq:"$920K",vol:"$2.7M",holders:"41,290",tv:"BINANCE:PEPEUSDT"},
 FOMO:{verified:false,symbol:"$FOMO",name:"Fomo Index",price:"$2.34",change:"-3.1%",coin:"FOM",cls:"red",why:"Social mentions cooling.",market:"$9.1M",liq:"$1.1M",vol:"$1.9M",holders:"8,120",tv:"BINANCE:BNBUSDT"}
};
let state={page:"home",history:[],liked:false,watch:new Set(),saved:new Set(),reposted:new Set(),posts:[],photo:null,video:null,mediaText:"",mediaEmoji:"",photoFilter:null,chartTf:"1D",videoTab:"For You",commentsPost:null,rewards:1250,live:false,walletConnected:false,cash:1250,marketFilter:"gainers",tokenSearch:"",friendsTab:"friends",createdTokens:[],launch:{name:"",symbol:"",supply:"1000000",description:"",website:"",twitter:"",telegram:""}};
const demoPosts=[
 {user:"Alex Crypto",handle:"@AlexCrypto",avatar:"AL",title:"Why I'm watching $XYZ",text:"Interesting volume growth + increasing holders. The onchain data tells a different story than the charts.",token:"XYZ",likes:124,comments:31},
 {user:"Sarah Onchain",handle:"@SarahOnchain",avatar:"SA",avatarCls:"orange",title:"$ABC accumulation pattern",text:"Three smart wallets I track all added $ABC positions in the last 24h. Worth paying attention.",token:"ABC",likes:82,comments:18},
 {user:"Lena Trades",handle:"@LenaTrades",avatar:"LE",avatarCls:"pink",title:"Watching liquidity before entry",text:"I want to see whether liquidity keeps expanding before I make a decision.",token:"DEF",likes:57,comments:11},
 {user:"CryptoMax",handle:"@CryptoMax",avatar:"CM",avatarCls:"blue",title:"Why $XYZ is moving",text:"Quick onchain breakdown — watch the wallet flows before chasing the candle.",token:"XYZ",likes:231,comments:42,video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"},
 {user:"Sarah Onchain",handle:"@SarahOnchain",avatar:"SA",avatarCls:"orange",title:"3 things I check before a perp",text:"Funding, open interest and liquidation levels. Here is the quick breakdown.",token:"ABC",likes:184,comments:27,video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"}
];
function navItems(){
 const items=[["home","⌂","Home"],["discover","◉","Discover"],["markets","⌕","Markets"],["futures","↕","Perps"],["create","+","Create"],["messages","✉","DMs"],["activity","〽","Activity"],["profile","♙","Profile"],["wallet","◈","Wallet"]];
 return items.map(([id,ic,label])=>`<button class="${state.page===id?"active":""}" onclick="go('${id}')">${ic}&nbsp;&nbsp;${label}</button>`).join("");
}
function renderNav(){
 document.getElementById("nav").innerHTML=navItems();
 document.getElementById("mobileNav").innerHTML=navItems().replace(/&nbsp;&nbsp;/g,"<br>");
}
function go(p){if(state.page!==p)state.history.push(state.page);state.page=p;render();}
function back(){const prev=state.history.pop()||"home";state.page=prev;render();}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1600)}
function coin(t){return `<div class="coin ${t.cls}">${t.coin}</div>`}
function spark(up=true){
 return `<div class="spark"><svg viewBox="0 0 240 60" preserveAspectRatio="none"><polyline fill="none" stroke="${up?'#00e6a0':'#ff5b72'}" stroke-width="2.5" points="${up?'0,45 20,39 42,42 64,33 84,37 108,26 130,31 151,22 174,28 194,17 214,20 240,10':'0,18 25,12 46,24 70,16 91,29 115,22 138,36 162,30 188,41 210,35 240,49'}"/></svg></div>`;
}
function tokenCard(k,withBuy=true){
 const t=tokens[k]; return `<div class="token-card" onclick="token('${k}')">${coin(t)}<div class="token-main"><b>${t.symbol}${t.verified?'<span class="verified">✓</span>':''}</b><small>${t.name}${t.verified?' · <span class="verified-token">Verified</span>':''}</small></div>${spark(!t.change.startsWith("-"))}<div class="price">${t.price}<div class="${t.change.startsWith("-")?'down':'up'}">${t.change}</div></div>${withBuy?`<button class="buy" onclick="event.stopPropagation();buy('${k}')">BUY ${t.symbol} ↗</button>`:""}</div>`;
}
function postCard(p){
 const t=tokens[p.token]; return `<article class="card post">
 <div class="user" onclick="event.stopPropagation();openProfile('${p.handle}','${p.user}')" style="cursor:pointer"><div class="avatar ${p.avatarCls||""}">${p.avatar}</div><div><b>${p.user}</b><span>${p.handle} · 2h</span></div></div>
 <h3>${p.title}</h3><p>${p.text}</p>${p.photo?`<img src="${p.photo}" style="width:100%;max-height:360px;object-fit:cover;border-radius:12px;margin-bottom:12px;filter:${p.photoFilter||'none'}">`:''}${tokenCard(p.token,false)}
 <div class="actions"><button onclick="like(this)">♡ ${p.likes+(state.liked&&p===demoPosts[0]?1:0)}</button><button onclick="openCommentsForPost(p)">💬 ${p.comments}</button><button class="${state.reposted.has(p.title)?'liked':''}" onclick="repost('${p.title.replace(/'/g,"\\'")}')">🔁</button><button class="${state.saved.has(p.title)?'liked':''}" onclick="savePost('${p.title.replace(/'/g,"\\'")}')">🔖</button><button onclick="sharePost('${encodeURIComponent(p.title)}')">↗</button><button class="buy" onclick="buy('${p.token}')">BUY ${t.symbol} ↗</button></div>
 </article>`;

function chartSvg(tf){
 const configs={
  "1H":{count:28,base:82,vol:42,step:2.7},
  "4H":{count:32,base:76,vol:48,step:2.2},
  "1D":{count:36,base:70,vol:55,step:1.9}
 };
 const c=configs[tf]||configs["1D"], W=900,H=320, left=14,right=74,top=12,bottom=58, chartH=225, volTop=252, volH=48;
 let price=c.base, candles=[], vols=[];
 for(let i=0;i<c.count;i++){
   const wave=Math.sin(i*0.72)*5 + Math.sin(i*0.19)*4 + i*c.step;
   const open=price;
   const close=c.base+wave+(i%5===0?4:0);
   const high=Math.max(open,close)+4+(i%4);
   const low=Math.min(open,close)-3-(i%3);
   price=close; candles.push({open,close,high,low}); vols.push(16+(i*13)%35);
 }
 const min=Math.min(...candles.map(x=>x.low))-4,max=Math.max(...candles.map(x=>x.high))+4;
 const py=v=>top+(max-v)/(max-min)*chartH;
 const x=i=>left+i*((W-left-right)/(c.count-1));
 const candleW=Math.max(6,((W-left-right)/c.count)*0.62);
 let grid='';
 for(let g=0;g<=5;g++){const y=top+g*chartH/5;const val=max-(max-min)*g/5;grid+=`<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#252936" stroke-width="1"/><text x="${W-right+8}" y="${y+4}" fill="#70798b" font-size="11">${val.toFixed(2)}</text>`;}
 for(let g=0;g<6;g++){const xx=left+g*(W-left-right)/5;grid+=`<line x1="${xx}" y1="${top}" x2="${xx}" y2="${volTop+volH}" stroke="#1e222d" stroke-width="1"/>`; }
 let body='',volume='';
 candles.forEach((d,i)=>{const xx=x(i), up=d.close>=d.open, cls=up?'#00e6a0':'#ff5b72'; const yO=py(d.open),yC=py(d.close),yH=py(d.high),yL=py(d.low); body+=`<line x1="${xx}" y1="${yH}" x2="${xx}" y2="${yL}" stroke="${cls}" stroke-width="2"/><rect x="${xx-candleW/2}" y="${Math.min(yO,yC)}" width="${candleW}" height="${Math.max(2,Math.abs(yC-yO))}" fill="${cls}" rx="1"/>`; const vh=vols[i]; volume+=`<rect x="${xx-candleW/2}" y="${volTop+volH-vh}" width="${candleW}" height="${vh}" fill="${cls}" opacity=".38"/>`;});
 const last=candles[candles.length-1].close,lastY=py(last);
 return `<div class="tv-wrap"><svg class="tv-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="TradingView style candlestick chart">${grid}<line x1="${left}" y1="${volTop-6}" x2="${W-right}" y2="${volTop-6}" stroke="#252936"/><text x="${left}" y="${volTop+42}" fill="#596274" font-size="10">VOL</text>${volume}${body}<line x1="${left}" y1="${lastY}" x2="${W-right}" y2="${lastY}" stroke="#00e6a0" stroke-dasharray="5 5" opacity=".75"/><rect x="${W-right+3}" y="${lastY-10}" width="65" height="20" rx="4" fill="#00e6a0"/><text x="${W-right+35}" y="${lastY+4}" text-anchor="middle" fill="#06110e" font-size="11" font-weight="700">${last.toFixed(2)}</text></svg><div class="tv-footer"><span>${tf} • Candles</span><span>Volume</span><span>Demo market data</span></div></div>`;
}

function previewMedia(input){const file=input.files?.[0];if(!file)return;const url=URL.createObjectURL(file);state.mediaType=file.type.startsWith('video')?'video':'photo';if(state.mediaType==='photo'){state.photo=url;document.getElementById('photoImg').src=url;document.getElementById('photoPreview').style.display='block';document.getElementById('videoPreview').style.display='none'}else{state.video=url;document.getElementById('videoPreviewEl').src=url;document.getElementById('videoPreview').style.display='block';document.getElementById('photoPreview').style.display='none'}document.getElementById('mediaTools').style.display='flex'}
function removeMedia(){state.photo=null;state.video=null;const i=document.getElementById('mediaInput');if(i)i.value='';document.getElementById('photoPreview').style.display='none';document.getElementById('videoPreview').style.display='none';document.getElementById('mediaTools').style.display='none';const v=document.getElementById('videoPreviewEl');if(v)v.removeAttribute('src')}
function adjustImage(type){const img=document.getElementById('photoImg');if(!img||!state.photo)return;const current=img.dataset.filter||'';img.dataset.filter=type==='brightness'?'brightness(1.18)':'contrast(1.18)';img.style.filter=img.dataset.filter;state.photoFilter=img.dataset.filter;toast('Applied '+type)}
function resetMediaEdit(){const img=document.getElementById('photoImg');if(img){img.style.filter='none';img.dataset.filter='';}state.photoFilter='none';toast('Edits reset')}

let selected="XYZ";
function selectChip(k){selected=k;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("selected"));document.getElementById("chip-"+k).classList.add("selected")}
function publish(){const title=document.getElementById("postTitle").value.trim()||"My $"+selected+" thesis";const text=document.getElementById("postText").value.trim()||"Watching the data and waiting for more evidence.";state.posts.unshift({user:"Alex Crypto",handle:"@AlexCrypto",avatar:"AL",title,text,token:selected,likes:0,comments:0,photo:state.photo,video:state.video,photoFilter:state.photoFilter,mediaText:state.mediaText,mediaEmoji:state.mediaEmoji});state.photo=null;state.video=null;state.photoFilter=null;state.mediaText="";state.mediaEmoji="";toast("Post published");go("home")}
function activity(){
 const items=[
  ['🐋','SarahOnchain','bought 1,190 $XYZ','3m ago','orange','@SarahOnchain','XYZ'],
  ['🔥','PULSE','$ABC is now #1 trending','12m ago','blue','@PULSE','ABC'],
  ['☆','You','added $XYZ to your watchlist','18m ago','','@AlexCrypto','XYZ'],
  ['💬','LenaTrades','posted about $DEF','45m ago','pink','@LenaTrades','DEF'],
  ['💰','MarcusFlow','bought 483 $DEF','1h ago','blue','@MarcusFlow','DEF'],
  ['❤️','SarahOnchain','liked your $XYZ post','2h ago','orange','@SarahOnchain','XYZ'],
  ['📈','PULSE','$PEPE social activity increased','3h ago','','@PULSE','PEPE'],
  ['👤','DegenDave','started following you','5h ago','','@DegenDave','XYZ']
 ];
 return `<div class="back-row"><button class="secondary" style="width:auto;margin:0;padding:8px 12px" onclick="back()">← Back</button></div><h1 class="page-title">Activity</h1><div class="subtitle">Market, social and wallet events in one place</div><div class="card list-card" style="margin-bottom:14px"><div class="row"><div><b>⚡ Your PULSE activity</b><div style="color:#697386;font-size:12px;margin-top:4px">Watchlists, posts, likes and trades</div></div><span style="color:var(--green)">${state.posts.length} new post${state.posts.length===1?'':'s'}</span></div></div>${items.map(x=>`<div class="card activity-item" style="margin-bottom:10px"><div class="row"><div class="user"><div class="activity-icon">${x[0]}</div><div><b style="cursor:pointer" onclick="openProfile('${x[5]}','${x[1]}')">${x[1]}</b> <span style="cursor:pointer" onclick="token('${x[6]}')">${x[2]}</span><div style="color:#697386;font-size:12px;margin-top:3px">${x[3]}</div></div></div></div></div>`).join('')}`;
}
function addMediaText(){const m=document.getElementById('mediaEditModal');document.getElementById('mediaEditTitle').textContent='Add text';document.getElementById('mediaEditText').value='';m.dataset.mode='text';m.style.display='flex';setTimeout(()=>document.getElementById('mediaEditText').focus(),50)}
function addMediaEmoji(){const m=document.getElementById('mediaEditModal');document.getElementById('mediaEditTitle').textContent='Add text & emoji';document.getElementById('mediaEditText').value='';m.dataset.mode='emoji';m.style.display='flex'}
function setMediaEmoji(e){state.mediaEmoji=e;document.getElementById('mediaEditText').value=(document.getElementById('mediaEditText').value+' '+e).trim()}
function applyMediaEdit(){const v=document.getElementById('mediaEditText').value.trim();if(v)state.mediaText=v;const o=document.getElementById('mediaOverlay');if(o)o.textContent=[state.mediaText,state.mediaEmoji].filter(Boolean).join(' ');document.getElementById('mediaEditModal').style.display='none';toast('Media overlay added')}
function render(){
 renderNav();
 const a=document.getElementById("app");
 if(state.page==="home")a.innerHTML=home();
 else if(state.page==="discover")a.innerHTML=discover();
 else if(state.page==="markets")a.innerHTML=markets();
 else if(state.page==="wallet")a.innerHTML=wallet();
 else if(state.page==="friends")a.innerHTML=friends();
 else if(state.page==="launchpad")a.innerHTML=launchpad();
 else if(state.page==="user-followers")a.innerHTML=socialList("followers");
 else if(state.page==="user-following")a.innerHTML=socialList("following");
 else if(state.page==="create")a.innerHTML=create();
 else if(state.page==="activity")a.innerHTML=activity();
 else if(state.page==="rewards")a.innerHTML=rewards();
 else if(state.page==="live")a.innerHTML=livePage();
 else if(state.page==="profile")a.innerHTML=profile();
 else if(state.page==="futures"){a.innerHTML=futures(); if(!perpState.showPositions) renderTV(selectedPerp().tv);}
 else if(state.page==="messages")a.innerHTML=messages();
 else if(state.page.startsWith("user:"))a.innerHTML=userProfile();
 else if(state.page.startsWith("dm:"))a.innerHTML=dmPage();
 else if(state.page.startsWith("token:")){const k=state.page.split(":")[1];a.innerHTML=tokenPage(k);setTimeout(()=>renderTokenTV(tokens[k].tv),0);}
 else if(state.page.startsWith("buy:"))a.innerHTML=buyPage(state.page.split(":")[1]);
 else if(state.page.startsWith("success:"))a.innerHTML=successPage(state.page.split(":")[1]);
}
function like(btn){state.liked=!state.liked;btn.classList.toggle("liked",state.liked);btn.textContent=state.liked?"♥ 125":"♡ 124"}
render();
</script>
<div id="commentsModal" class="comments-modal" onclick="if(event.target===this)closeComments()"><div class="comments-box"><div class="row"><h2 id="commentsTitle" style="margin:0">Comments</h2><button class="watch-btn" onclick="closeComments()">×</button></div><div id="commentsList"></div><div style="display:flex;gap:8px;margin-top:12px"><input id="commentInput" class="input" style="margin:0" placeholder="Write a comment..."><button class="primary" style="width:auto" onclick="addComment()">Send</button></div></div></div><div id="shareModal" class="comments-modal" onclick="if(event.target===this)this.style.display='none'"><div class="comments-box"><div class="row"><h2 style="margin:0">Share</h2><button class="watch-btn" onclick="this.closest('.comments-modal').style.display='none'">×</button></div><p id="shareText" class="demo"></p><div class="share-row"><a id="shareX" class="share-row" target="_blank" rel="noopener"><button>𝕏</button></a><a id="shareTelegram" target="_blank" rel="noopener"><button>Telegram</button></a><a id="shareWhatsApp" target="_blank" rel="noopener"><button>WhatsApp</button></a><button onclick="navigator.clipboard?.writeText(location.href);toast('Link copied')">Copy link</button></div></div></div>
